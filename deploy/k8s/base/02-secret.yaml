# Secret は接続文字列などの機密値を Pod に渡すためのリソースです。
# これは教材用のダミー値です。本物の DATABASE_URL やパスワードをリポジトリに入れないでください。
apiVersion: v1
kind: Secret
metadata:
  name: shortlink-secret
  namespace: shortlink
  labels:
    app.kubernetes.io/name: shortlink
    app.kubernetes.io/instance: shortlink
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: study-backend-scale
type: Opaque
stringData:
  # deploy/k8s/postgres の教材用 Postgres と一致するダミー接続文字列です。
  DATABASE_URL: postgres://shortlink:shortlink_password@postgres:5432/shortlink?sslmode=disable
