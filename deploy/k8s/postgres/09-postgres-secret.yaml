# PostgreSQL コンテナに渡す教材用 Secret です。
# これはダミー値です。本物のパスワードをリポジトリに入れないでください。
# deploy/k8s/base/02-secret.yaml の DATABASE_URL と同じパスワードにしています。
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shortlink
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: shortlink
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: study-backend-scale
type: Opaque
stringData:
  POSTGRES_PASSWORD: shortlink_password
