# Deployment は Pod の望ましい状態を宣言し、ReplicaSet 経由で Pod 数を保ちます。
# full の app は PostgreSQL に保存し、Redis を cache-aside として使います。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink
  namespace: shortlink-full
  labels:
    app.kubernetes.io/name: shortlink
    app.kubernetes.io/instance: shortlink-full
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: study-backend-scale
spec:
  replicas: 2
  # RollingUpdate は古い Pod を残しながら新しい Pod を少しずつ作ります。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 1 により、更新中だけ desired replicas より 1 つ多く起動できます。
      maxSurge: 1
      # maxUnavailable: 0 により、ready な Pod 数を減らさずに入れ替えます。
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shortlink
      app.kubernetes.io/instance: shortlink-full
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortlink
        app.kubernetes.io/instance: shortlink-full
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: study-backend-scale
    spec:
      # アプリは起動時に PostgreSQL へ接続して schema を初期化するため、DB の準備完了を待ちます。
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U shortlink -d shortlink; do sleep 2; done
      containers:
        - name: shortlink
          # image は kind に読み込むローカル Docker イメージ名です。
          image: shortlink:dev
          # imagePullPolicy: Never は外部レジストリへ取りに行かず、kind 内のローカルイメージだけを使います。
          imagePullPolicy: Never
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shortlink-config
                  key: PORT
            - name: STORAGE
              valueFrom:
                configMapKeyRef:
                  name: shortlink-config
                  key: STORAGE
            - name: SQLITE_PATH
              valueFrom:
                configMapKeyRef:
                  name: shortlink-config
                  key: SQLITE_PATH
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: shortlink-config
                  key: REDIS_ADDR
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shortlink-config
                  key: LOG_LEVEL
            - name: REQUEST_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: shortlink-config
                  key: REQUEST_TIMEOUT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shortlink-secret
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          # /healthz は外部依存を見ないため、DB 障害で再起動ループに入りません。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # /readyz は storage へ ping し、DB 準備中は 503 を返してトラフィックを止めます。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # resources はスケジューリング時の予約(requests)と上限(limits)です。
          # HPA は CPU requests を基準に利用率を計算します。
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
