# HorizontalPodAutoscaler は CPU 使用率を見て Deployment の Pod 数を増減します。
# kind で観察するには metrics-server が必要です。手順は README.md を参照してください。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortlink
  namespace: shortlink-full
  labels:
    app.kubernetes.io/name: shortlink
    app.kubernetes.io/instance: shortlink-full
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: study-backend-scale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortlink
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
