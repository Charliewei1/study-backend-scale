# Secret は接続文字列やパスワードなどの機密値を Pod に渡すためのリソースです。
# これは教材用のダミー値です。本物の認証情報をリポジトリに入れないでください。
apiVersion: v1
kind: Secret
metadata:
  name: shortlink-secret
  namespace: shortlink-full
  labels:
    app.kubernetes.io/name: shortlink
    app.kubernetes.io/instance: shortlink-full
    app.kubernetes.io/part-of: study-backend-scale
type: Opaque
stringData:
  # アプリが STORAGE=postgres のときに読む接続文字列です。
  DATABASE_URL: postgres://shortlink:shortlink_password@postgres:5432/shortlink?sslmode=disable
  # PostgreSQL コンテナに渡す教材用パスワードです。DATABASE_URL と一致させます。
  POSTGRES_PASSWORD: shortlink_password
